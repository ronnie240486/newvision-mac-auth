name: Optimus - logo OP, painel, Assistindo e ajustes

# Corrige o APK pronto do Optimus SEM reconstruir o app inteiro:
#  - painel: Railway no lugar do Manus e heartbeat com "__idle__" quando nada toca
#  - "Assistindo": o painel passa a mostrar o canal/filme/série que o cliente está vendo (igual ao Ouro Pro/Maximus)
#  - avisos da lista, aviso de vencimento e mensagens do painel aparecem na tela; comandos remotos funcionam
#  - falha de reprodução avisa o painel; troca automática de lista (reserva e volta para a principal)
#  - logo OP no ícone do app (todos os tamanhos, banner de TV, splash, ativação) e dentro do app
#  - "Sair" (menu) e "Deslogar" (Configurações) FECHAM o app, sem apagar o login
#  - tira o aviso de atualização que ficava aparecendo na tela
# Como usar: suba optimus_logo.png na raiz do repositório (se ainda não estiver) e este arquivo em .github/workflows.
# Roda sozinho quando um dos dois é enviado. O APK sai em Actions > (execução) > Artifacts.
on:
  push:
    paths:
      - ".github/workflows/optimus-painel.yml"
      - "optimus_logo.png"
  workflow_dispatch:
    inputs:
      apk:
        description: "Nome do APK de origem (arquivo na raiz do repositório)"
        required: true
        default: "Optimus1.0.20-global-bg-profile-menu-delete-fixed.apk"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar só o APK escolhido e a logo
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ${{ inputs.apk || 'Optimus1.0.20-global-bg-profile-menu-delete-fixed.apk' }}
            optimus_logo.png
          sparse-checkout-cone-mode: false

      - name: Instalar ferramentas (smali/baksmali, zip e Pillow)
        run: |
          exec > >(tee /tmp/step.log) 2>&1
          trap 'rc=$?; sleep 1; [ $rc -eq 0 ] || echo "::error title=Falhou::$(tail -n 14 /tmp/step.log | cut -c1-260 | sed "s/%/%25/g" | paste -sd "|" -)"' EXIT
          sudo apt-get update -q
          sudo apt-get install -y -q smali zip unzip python3-pil
          command -v baksmali && command -v smali
          python3 -c "from PIL import features; assert features.check('webp'), 'Pillow sem suporte a WebP'; print('Pillow OK com WebP')"

      - name: Chave de assinatura (guardada em cache entre execuções)
        id: keycache
        uses: actions/cache@v4
        with:
          path: optimus.keystore
          key: optimus-keystore-v1

      - name: Criar a chave se ainda não existir
        run: |
          if [ ! -f optimus.keystore ]; then
            keytool -genkeypair -v -keystore optimus.keystore -storepass optimus-test-key -keypass optimus-test-key \
              -alias optimus -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Optimus Test"
          fi

      - name: Corrigir o APK
        env:
          APK: ${{ inputs.apk || 'Optimus1.0.20-global-bg-profile-menu-delete-fixed.apk' }}
        run: |
          exec > >(tee /tmp/step.log) 2>&1
          trap 'rc=$?; sleep 1; [ $rc -eq 0 ] || echo "::error title=Falhou::$(tail -n 14 /tmp/step.log | cut -c1-260 | sed "s/%/%25/g" | paste -sd "|" -)"' EXIT
          set -euo pipefail
          test -f "$APK" || { echo "APK não encontrado: $APK"; exit 1; }
          test -f optimus_logo.png || { echo "Falta o arquivo optimus_logo.png na raiz do repositório (suba a logo e rode de novo)"; exit 1; }
          mkdir -p work/dex work/new work/res work/jc work/d8
          cd work/dex && unzip -q "../../$APK" 'classes*.dex' && cd ../..

          cat > patch_all.py <<'PYEOF'
          """Patches de smali do Optimus (rodam sobre a pasta gerada pelo baksmali de UM dex).
          Uso: python3 patch_all.py <pasta_smali> <arquivo_de_relatorio>
          Cada patch aplicado é anotado no relatório; o workflow confere no fim que todos entraram."""
          import os, sys

          OLD = "https://renciaapp.manus.space"
          NEW = "https://renciaapp-production.up.railway.app"
          HEADER = ".method public heartbeat(Ljava/lang/String;Ljava/lang/String;)Lorg/json/JSONObject;"
          IDLE_BLOCK = """
              # Optimus: sem conteudo tocando, manda a sentinela __idle__ (limpa o "Assistindo" no painel)
              if-eqz p2, :ominus_idle

              invoke-virtual {p2}, Ljava/lang/String;->trim()Ljava/lang/String;

              move-result-object v0

              invoke-virtual {v0}, Ljava/lang/String;->isEmpty()Z

              move-result v0

              if-eqz v0, :ominus_keep

              :ominus_idle
              const-string p2, "__idle__"

              :ominus_keep
          """
          LOGO_URI = "file:///android_asset/optimus_logo.png"


          def read(p):
              return open(p, encoding="utf-8").read()


          def write(p, t):
              open(p, "w", encoding="utf-8").write(t)


          def find(root, suffix):
              """Acha arquivos smali cujo caminho termina exatamente em suffix (com fronteira de pasta)."""
              out = []
              for dp, _, fs in os.walk(root):
                  for n in fs:
                      p = os.path.join(dp, n).replace("\\", "/")
                      if p.endswith("/" + suffix):
                          out.append(os.path.join(dp, n))
              return out


          def insert_after_locals(path, method_header, new_lines, marker):
              """Entra logo depois do .locals/.registers do método. Devolve 'aplicado' / 'ja-aplicado'."""
              text = read(path)
              if marker in text:
                  return "ja-aplicado"
              lines = text.split("\n")
              try:
                  start = next(i for i, l in enumerate(lines) if l.strip() == method_header)
              except StopIteration:
                  raise SystemExit("ERRO: metodo nao encontrado: " + method_header + " em " + path)
              j = start + 1
              while not lines[j].strip().startswith((".locals", ".registers")):
                  if lines[j].strip().startswith(".end method"):
                      raise SystemExit("ERRO: .locals nao encontrado em " + method_header)
                  j += 1
              lines[j + 1:j + 1] = [""] + new_lines
              write(path, "\n".join(lines))
              return "aplicado"


          def patch_heartbeat(path):
              text = read(path)
              if "__idle__" in text:
                  return "ja-aplicado"
              lines = text.split("\n")
              try:
                  start = next(i for i, l in enumerate(lines) if l.strip() == HEADER)
              except StopIteration:
                  raise SystemExit("ERRO: metodo heartbeat(String,String) nao encontrado em " + path)
              i = start + 1
              in_annotation = False
              registers_line = None
              while i < len(lines):
                  s = lines[i].strip()
                  if s.startswith(".registers") or s.startswith(".locals"):
                      registers_line = s
                  if s.startswith(".annotation"):
                      in_annotation = True
                  elif s.startswith(".end annotation"):
                      in_annotation = False
                  elif in_annotation or s == "" or s.startswith((".registers", ".locals", ".param", ".end param")):
                      pass
                  else:
                      break
                  i += 1
              if registers_line is None:
                  raise SystemExit("ERRO: .registers/.locals nao encontrado no metodo heartbeat")
              n = int(registers_line.split()[1])
              free = n - 3 if registers_line.startswith(".registers") else n
              if free < 1:
                  raise SystemExit("ERRO: heartbeat sem registrador livre (" + registers_line + ")")
              lines[i:i] = IDLE_BLOCK.rstrip("\n").split("\n") + [""]
              write(path, "\n".join(lines))
              return "aplicado"


          def patch_panel(root, report):
              replaced = 0
              for dp, _, fs in os.walk(root):
                  for n in fs:
                      if n.endswith(".smali"):
                          p = os.path.join(dp, n)
                          t = read(p)
                          if OLD in t:
                              write(p, t.replace(OLD, NEW))
                              replaced += 1
              if replaced:
                  print("endereco do painel trocado em", replaced, "arquivo(s) smali")
                  report.add("painel")
              for g in find(root, "com/iptv/newvision/integration/RenciaGateway.smali"):
                  print("heartbeat:", patch_heartbeat(g))
                  report.add("heartbeat")


          def patch_update_banner(root, report):
              """Aviso de atualização fixo na tela: a função que desenha o banner passa a não fazer nada."""
              for p in find(root, "com/iptv/cliente/ui/components/UpdateBannerKt.smali"):
                  r = insert_after_locals(
                      p, ".method public static final UpdateBanner(Landroidx/compose/runtime/Composer;I)V",
                      ["    # Optimus: sem aviso de atualizacao na tela", "    return-void"],
                      "# Optimus: sem aviso de atualizacao na tela")
                  print("aviso de atualizacao:", r)
                  report.add("atualizacao")


          def patch_close_app(root, report):
              """'Sair' (menu) e 'Deslogar' (configuracoes) passam a FECHAR o app, sem apagar o login.
              Todos os caminhos de logout do app passam por AppNav$doLogout, entao o ajuste e num lugar so."""
              for p in find(root, "com/iptv/cliente/MainActivityKt.smali"):
                  r = insert_after_locals(
                      p, ".method private static final AppNav$doLogout(Lkotlinx/coroutines/CoroutineScope;Landroidx/navigation/NavHostController;)V",
                      ["    # Optimus: Sair/Deslogar fecham o aplicativo (nao apagam o login)",
                       "    invoke-static {}, Landroid/os/Process;->myPid()I",
                       "    move-result v0",
                       "    invoke-static {v0}, Landroid/os/Process;->killProcess(I)V",
                       "    const/4 v0, 0x0",
                       "    invoke-static {v0}, Ljava/lang/System;->exit(I)V",
                       "    return-void"],
                      "# Optimus: Sair/Deslogar fecham o aplicativo")
                  print("fechar app:", r)
                  report.add("fechar")


          def replace_const_string(root, suffix, old_text_start, new_value, key, report):
              for p in find(root, suffix):
                  t = read(p)
                  lines = t.split("\n")
                  hit = [i for i, l in enumerate(lines) if l.strip().startswith("const-string") and old_text_start in l]
                  if not hit:
                      if new_value in t:
                          print(key + ": ja-aplicado"); report.add(key); continue
                      raise SystemExit("ERRO: texto nao encontrado (%s) em %s" % (old_text_start, p))
                  for i in hit:
                      reg = lines[i].split()[1].rstrip(",")
                      lines[i] = '    const-string %s, "%s"' % (reg, new_value)
                  write(p, "\n".join(lines))
                  print(key + ": aplicado"); report.add(key)


          def patch_close_texts(root, report):
              replace_const_string(root, "com/iptv/cliente/ui/components/ComposableSingletons$SideNavKt$lambda-3$1.smali",
                                   "Sair da conta?", "Fechar o aplicativo?", "fechar_titulo", report)
              replace_const_string(root, "com/iptv/cliente/ui/components/ComposableSingletons$SideNavKt$lambda-4$1.smali",
                                   "digitar usu", "O aplicativo ser\\u00e1 fechado. Confirma que quer sair?", "fechar_texto", report)
              replace_const_string(root, "com/iptv/cliente/ui/settings/SettingsScreenKt.smali",
                                   '"Deslogar"', "Fechar app", "fechar_config", report)


          def patch_logo(root, report):
              """Logo dentro do app: sempre o arquivo que vai junto no APK (assets/optimus_logo.png)."""
              for p in find(root, "com/iptv/cliente/data/platform/PlatformBranding.smali"):
                  r = insert_after_locals(
                      p, ".method public final getLogoUrl()Ljava/lang/String;",
                      ["    # Optimus: logo OP embutida no app", '    const-string v0, "%s"' % LOGO_URI, "    return-object v0"],
                      "# Optimus: logo OP embutida no app")
                  print("logo interna:", r)
                  report.add("logo")


          def patch_panel_hooks(root, report):
              """Liga o OptimusPanel (código novo, em dex à parte) nos pontos certos do app."""
              ONE = "# Optimus: gancho do painel"
              for p in find(root, "com/iptv/cliente/App.smali"):
                  text = read(p)
                  if ONE in text:
                      print("gancho App: ja-aplicado"); report.add("hook_app"); continue
                  lines = text.split("\n")
                  start = next((i for i, l in enumerate(lines) if l.strip() == ".method public onCreate()V"), None)
                  if start is None:
                      raise SystemExit("ERRO: App.onCreate nao encontrado")
                  sup = next((j for j in range(start, len(lines))
                              if lines[j].strip() == "invoke-super {p0}, Landroid/app/Application;->onCreate()V"), None)
                  if sup is None:
                      raise SystemExit("ERRO: invoke-super de App.onCreate nao encontrado")
                  lines[sup + 1:sup + 1] = ["", "    " + ONE,
                                            "    invoke-static {p0}, Lcom/optimus/panel/OptimusPanel;->start(Landroid/app/Application;)V"]
                  write(p, "\n".join(lines))
                  print("gancho App: aplicado"); report.add("hook_app")
              for p in find(root, "com/iptv/cliente/data/PlaybackContext.smali"):
                  r1 = insert_after_locals(
                      p, ".method public final setPending(Lcom/iptv/cliente/data/PlaybackContext$Request;)V",
                      ["    " + ONE + " (conteudo novo)",
                       "    invoke-static {p1}, Lcom/optimus/panel/OptimusPanel;->onPending(Ljava/lang/Object;)V"],
                      ONE + " (conteudo novo)")
                  r2 = insert_after_locals(
                      p, ".method public final setPlayerActive(Z)V",
                      ["    " + ONE + " (player ativo)",
                       "    invoke-static {p1}, Lcom/optimus/panel/OptimusPanel;->onPlayerActive(Z)V"],
                      ONE + " (player ativo)")
                  print("gancho conteudo:", r1, "| gancho player:", r2)
                  report.add("hook_pending"); report.add("hook_active")
              for p in find(root, "com/iptv/cliente/ui/player/PlayerScreenKt$PlayerScreen$exoPlayer$1$1$1.smali"):
                  r = insert_after_locals(
                      p, ".method public onPlayerError(Landroidx/media3/common/PlaybackException;)V",
                      ["    " + ONE + " (erro do player)",
                       "    invoke-static {}, Lcom/optimus/panel/OptimusPanel;->onPlayerError()V"],
                      ONE + " (erro do player)")
                  print("gancho erro do player:", r); report.add("hook_error")


          class Report(set):
              pass


          if __name__ == "__main__":
              root, out = sys.argv[1], sys.argv[2]
              rep = Report()
              patch_panel(root, rep)
              patch_update_banner(root, rep)
              patch_close_app(root, rep)
              patch_close_texts(root, rep)
              patch_logo(root, rep)
              patch_panel_hooks(root, rep)
              with open(out, "a") as f:
                  for x in sorted(rep):
                      f.write(x + "\n")
          PYEOF

          cat > make_assets.py <<'PYEOF'
          """Gera as imagens novas (ícones, banner, splash, logo da ativação) a partir da logo OP.
          Uso: python3 make_assets.py <apk_origem> <optimus_logo.png> <pasta_saida>
          Mantém o tamanho de cada imagem que já existe no APK, só troca o desenho."""
          import io, os, re, sys, zipfile
          from PIL import Image

          apk, logo_path, out = sys.argv[1:4]
          logo = Image.open(logo_path).convert("RGBA")
          z = zipfile.ZipFile(apk)
          BG = (13, 19, 31, 255)  # azul-marinho da própria logo, para banner de TV

          def fit_square(size):
              return logo.resize((size, size), Image.LANCZOS)

          def save(img, rel, fmt):
              path = os.path.join(out, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              if fmt == "WEBP":
                  img.save(path, "WEBP", quality=95, method=6)
              else:
                  img.save(path, "PNG", optimize=True)
              print("gerado", rel, img.size)

          done = 0
          for name in z.namelist():
              if not name.startswith("res/drawable"):
                  continue
              base = os.path.basename(name)
              if re.fullmatch(r"ic_launcher(_round)?\.webp", base) or base == "splash_logo.webp":
                  w, h = Image.open(io.BytesIO(z.read(name))).size
                  save(fit_square(min(w, h)).resize((w, h), Image.LANCZOS) if w != h else fit_square(w), name, "WEBP"); done += 1
              elif base == "optimus_activation_logo.png":
                  w, h = Image.open(io.BytesIO(z.read(name))).size
                  save(fit_square(min(w, h)), name, "PNG"); done += 1
              elif base == "banner.webp":
                  w, h = Image.open(io.BytesIO(z.read(name))).size
                  canvas = Image.new("RGBA", (w, h), BG)
                  side = int(h * 0.94)
                  canvas.alpha_composite(fit_square(side), ((w - side) // 2, (h - side) // 2))
                  save(canvas.convert("RGB"), name, "WEBP"); done += 1

          if done < 10:
              raise SystemExit("ERRO: so %d imagens de icone encontradas (esperava 14+)" % done)
          os.makedirs(os.path.join(out, "assets"), exist_ok=True)
          logo.resize((768, 768), Image.LANCZOS).save(os.path.join(out, "assets", "optimus_logo.png"), optimize=True)
          print("gerado assets/optimus_logo.png; total de imagens trocadas:", done)
          PYEOF

          mkdir -p src/com/optimus/panel
          cat > src/com/optimus/panel/OptimusPanel.java <<'JEOF'
          package com.optimus.panel;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Application;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.lang.ref.WeakReference;
          import java.lang.reflect.Method;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ScheduledExecutorService;
          import java.util.concurrent.TimeUnit;

          /**
           * Ligação do Optimus com o painel (igual ao que o Ouro Pro/Maximus fazem):
           *  - "Assistindo": manda o título do que está tocando (ou __idle__ quando nada toca), na hora e a cada 60 s;
           *  - avisos da lista, aviso de vencimento e mensagens do painel, mostrados na tela e confirmados;
           *  - comandos remotos (exibir aviso, trocar lista, atualizar lista/DNS, reiniciar player, sincronizar acesso);
           *  - falha de reprodução: avisa o painel, que troca a DNS/lista; o app recarrega na lista nova;
           *  - troca automática de lista quando o painel coloca o cliente na lista reserva (e volta para a principal).
           * Só usa as classes do app por reflexão, então não quebra se algum nome mudar: no pior caso, esse recurso fica parado.
           */
          public final class OptimusPanel {
              private static final String[] BASES = {
                      "https://renciaapp-production.up.railway.app",
                      "https://renciaapp.manus.space"
              };
              private static final String APP_ID = "optimus";
              private static final String IDLE = "__idle__";
              private static final String PREFS = "optimus_panel_prefs";
              private static final String INTEGRATION = "com.iptv.newvision.integration.";

              private static final Handler MAIN = new Handler(Looper.getMainLooper());
              private static final Object LOCK = new Object();
              private static final Set<Long> SHOWN_ALERTS = new HashSet<Long>();

              private static Application app;
              private static ScheduledExecutorService executor;
              private static volatile WeakReference<Activity> top = new WeakReference<Activity>(null);
              private static volatile boolean started;
              private static volatile boolean playerActive;
              private static volatile String pendingTitle;
              private static volatile String lastSentContent = "";
              private static volatile boolean sendAppId = true;
              private static volatile long lastReloadAt;
              private static volatile long lastFailureReportAt;
              private static volatile boolean failureInFlight;
              private static volatile boolean reloading;
              private static long firstErrorAt;
              private static int errorCount;

              private OptimusPanel() {}

              // ------------------------------------------------------------------ ganchos chamados pelo app

              /** Application.onCreate */
              public static void start(Application application) {
                  synchronized (LOCK) {
                      if (started || application == null) return;
                      started = true;
                      app = application;
                  }
                  try {
                      application.registerActivityLifecycleCallbacks(new Application.ActivityLifecycleCallbacks() {
                          @Override public void onActivityResumed(Activity a) { top = new WeakReference<Activity>(a); }
                          @Override public void onActivityPaused(Activity a) {
                              Activity cur = top.get();
                              if (cur == a) top = new WeakReference<Activity>(null);
                          }
                          @Override public void onActivityCreated(Activity a, Bundle b) {}
                          @Override public void onActivityStarted(Activity a) {}
                          @Override public void onActivityStopped(Activity a) {}
                          @Override public void onActivitySaveInstanceState(Activity a, Bundle b) {}
                          @Override public void onActivityDestroyed(Activity a) {}
                      });
                  } catch (Throwable ignored) {
                  }
                  executor = Executors.newSingleThreadScheduledExecutor();
                  executor.scheduleWithFixedDelay(new Runnable() {
                      @Override public void run() { cycle(); }
                  }, 8, 60, TimeUnit.SECONDS);
              }

              /** PlaybackContext.setPending(Request): chegou um novo conteúdo para tocar (ou troca de canal/episódio). */
              public static void onPending(Object request) {
                  try {
                      if (request == null) return;
                      Object title = request.getClass().getMethod("getTitle").invoke(request);
                      pendingTitle = title instanceof String ? ((String) title).trim() : null;
                      if (playerActive) pushContentNow();
                  } catch (Throwable ignored) {
                  }
              }

              /** PlaybackContext.setPlayerActive(boolean): a tela do player abriu/fechou. */
              public static void onPlayerActive(boolean active) {
                  playerActive = active;
                  if (!active) {
                      errorCount = 0;
                  }
                  pushContentNow();
              }

              /** onPlayerError do player: se repetir, avisa o painel para trocar DNS/lista. */
              public static void onPlayerError() {
                  if (!started) return;
                  long now = System.currentTimeMillis();
                  synchronized (LOCK) {
                      if (now - firstErrorAt > 45000L) { firstErrorAt = now; errorCount = 0; }
                      errorCount++;
                      if (errorCount < 2) return;
                  }
                  if (failureInFlight || reloading) return;
                  if (now - lastFailureReportAt < 30000L || now - lastReloadAt < 20000L) return;
                  lastFailureReportAt = now;
                  failureInFlight = true;
                  submit(new Runnable() {
                      @Override public void run() {
                          try { reportPlaybackFailure(); } finally { failureInFlight = false; }
                      }
                  });
              }

              // ------------------------------------------------------------------ ciclo de 60 s

              private static void submit(Runnable r) {
                  try {
                      if (executor != null) executor.execute(r);
                  } catch (Throwable ignored) {
                  }
              }

              private static void pushContentNow() {
                  submit(new Runnable() {
                      @Override public void run() {
                          try { sendHeartbeat(); } catch (Throwable ignored) {}
                      }
                  });
              }

              private static void cycle() {
                  try {
                      if (currentMac().isEmpty()) return;
                      sendHeartbeat();
                      handleNotifications();
                  } catch (Throwable ignored) {
                  }
              }

              private static String currentContent() {
                  String t = pendingTitle;
                  if (!playerActive || t == null || t.length() == 0) return IDLE;
                  return t;
              }

              private static JSONObject sendHeartbeat() throws Exception {
                  String mac = currentMac();
                  if (mac.isEmpty()) return null;
                  String content = currentContent();
                  lastSentContent = content;
                  String path = "/api/v5/heartbeat?mac=" + enc(mac) + "&current_content=" + enc(content);
                  JSONObject response = getWithAppId(path);
                  if (response != null) handleCommand(response.optJSONObject("command"), mac);
                  return response;
              }

              // ------------------------------------------------------------------ avisos, vencimento, troca de lista

              private static void handleNotifications() throws Exception {
                  String mac = currentMac();
                  if (mac.isEmpty()) return;
                  JSONObject payload = get("/api/v5/list-notifications?mac=" + enc(mac));
                  if (payload == null || !payload.optBoolean("success", false)) return;

                  SharedPreferences prefs = prefs();
                  long transitionId = payload.optLong("failover_transition_id", 0L);
                  boolean syncRequired = payload.optBoolean("playlist_sync_required", false);
                  boolean restored = "primary_restored".equalsIgnoreCase(payload.optString("failover_state", ""));
                  long seen = prefs == null ? 0L : prefs.getLong("failover_transition_id", 0L);
                  boolean already = transitionId > 0L && transitionId == seen;
                  if ((syncRequired || restored) && transitionId > 0L && !already) {
                      int number = payload.optInt("active_list_number", 0);
                      if (prefs != null) prefs.edit().putLong("failover_transition_id", transitionId).apply();
                      int wanted = number - 1;
                      if (wanted >= 0 && wanted != cacheActiveIndex()) {
                          toast(restored ? "Lista principal restaurada" : "Lista reserva ativada");
                          reloadLists(wanted);
                          return;
                      }
                  }

                  JSONObject expiration = payload.optJSONObject("expiration");
                  if (expiration != null && expiration.optBoolean("show_modal", false)) {
                      String key = expiration.optString("modal_key", "");
                      String shown = prefs == null ? "" : prefs.getString("expiration_key", "");
                      if (!key.isEmpty() && !key.equals(shown)) {
                          if (showDialog(expiration.optString("modal_title", "Aviso"), expiration.optString("modal_message", ""))) {
                              if (prefs != null) prefs.edit().putString("expiration_key", key).apply();
                          }
                      }
                  }

                  JSONArray list = payload.optJSONArray("notifications");
                  if (list != null) {
                      for (int i = 0; i < list.length(); i++) {
                          JSONObject n = list.optJSONObject(i);
                          if (n == null || n.optBoolean("acknowledged", false)) continue;
                          final long id = n.optLong("id", 0L);
                          if (id <= 0L) continue;
                          synchronized (SHOWN_ALERTS) { if (SHOWN_ALERTS.contains(id)) continue; }
                          if (showDialog(n.optString("title", "Aviso"), n.optString("message", ""))) {
                              synchronized (SHOWN_ALERTS) { SHOWN_ALERTS.add(id); }
                              JSONObject body = new JSONObject();
                              body.put("mac", mac);
                              body.put("alert_id", id);
                              post("/api/v5/list-notifications/ack", body);
                          }
                      }
                  }
              }

              // ------------------------------------------------------------------ comandos remotos

              private static void handleCommand(JSONObject command, String mac) {
                  try {
                      if (command == null) {
                          JSONObject r = getWithAppId("/api/v5/remote-commands?mac=" + enc(mac));
                          command = r == null ? null : r.optJSONObject("command");
                      }
                      if (command == null) return;
                      int id = command.optInt("id", 0);
                      if (id <= 0) return;
                      String type = command.optString("type", "");
                      JSONObject p = command.optJSONObject("payload");
                      if (p == null) p = new JSONObject();
                      String status = "executed";
                      String result = "";
                      if ("show_message".equals(type)) {
                          String msg = p.optString("message", "");
                          String title = p.optString("title", "Aviso");
                          if (msg.isEmpty()) { status = "failed"; result = "Mensagem vazia"; }
                          else if (!showDialog(title.isEmpty() ? "Aviso" : title, msg)) { return; } // tela fechada: tenta no próximo ciclo
                      } else if ("switch_playlist".equals(type)) {
                          int idx = p.optInt("listIndex", p.optInt("list_index", 0)) - 1;
                          if (idx < 0 || !cacheHasList(idx)) { status = "failed"; result = "Lista inexistente neste aparelho"; }
                          else {
                              ack(mac, id, status, "Trocando para a lista " + (idx + 1));
                              reloadLists(idx);
                              return;
                          }
                      } else if ("refresh_playlist".equals(type) || "update_dns".equals(type)
                              || "sync_access".equals(type) || "restart_player".equals(type)) {
                          ack(mac, id, status, "Recarregando a lista");
                          reloadLists(Math.max(0, cacheActiveIndex()));
                          return;
                      } else {
                          status = "failed";
                          result = "Comando não suportado: " + type;
                      }
                      ack(mac, id, status, result);
                  } catch (Throwable ignored) {
                  }
              }

              private static void ack(String mac, int id, String status, String message) {
                  try {
                      JSONObject body = new JSONObject();
                      body.put("mac", mac);
                      body.put("command_id", id);
                      body.put("status", status);
                      body.put("app", APP_ID);
                      if (message != null && message.length() > 0) body.put("result_message", message);
                      post("/api/v5/remote-commands/ack", body);
                  } catch (Throwable ignored) {
                  }
              }

              // ------------------------------------------------------------------ falha de reprodução

              private static void reportPlaybackFailure() {
                  try {
                      String mac = currentMac();
                      if (mac.isEmpty()) return;
                      JSONObject body = new JSONObject();
                      body.put("mac", mac);
                      body.put("active_list_number", Math.max(0, cacheActiveIndex()) + 1);
                      JSONObject r = post("/api/v5/playback-failure", body);
                      if (r == null) return;
                      if (r.optBoolean("switch_applied", false)) {
                          int number = r.optInt("list_index", r.optInt("next_playlist_number", 0));
                          SharedPreferences prefs = prefs();
                          long tid = r.optLong("failover_transition_id", 0L);
                          if (prefs != null && tid > 0L) prefs.edit().putLong("failover_transition_id", tid).apply();
                          toast("Lista reserva ativada");
                          if (number > 0) reloadLists(number - 1);
                      } else if (r.optBoolean("dns_failover_applied", false) || r.optBoolean("retry_current_playlist", false)) {
                          toast("Atualizando a lista");
                          reloadLists(Math.max(0, cacheActiveIndex()));
                      }
                  } catch (Throwable ignored) {
                  }
              }

              // ------------------------------------------------------------------ recarregar lista (mesmo caminho do "Trocar lista" do app)

              private static void reloadLists(final int index) {
                  if (reloading) return;
                  reloading = true;
                  lastReloadAt = System.currentTimeMillis();
                  final String mac = currentMac();
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try {
                              Class<?> gwType = Class.forName(INTEGRATION + "RenciaGateway");
                              Object gw = gwType.getDeclaredConstructor().newInstance();
                              Object accesses = gwType.getMethod("loadAccesses", String.class).invoke(gw, mac);
                              Class<?> cache = Class.forName(INTEGRATION + "RenciaCredentialCache");
                              cache.getMethod("setAll", Context.class, List.class).invoke(null, app, accesses);
                          } catch (Throwable ignored) {
                              // sem rede/painel: segue com as listas que o app já tem
                          }
                          MAIN.post(new Runnable() {
                              @Override public void run() { switchAndOpen(index); }
                          });
                      }
                  }, "optimus-reload").start();
              }

              private static void switchAndOpen(int index) {
                  try {
                      int count = cacheCount();
                      int target = index;
                      if (target < 0 || target >= count) target = Math.max(0, Math.min(count - 1, cacheActiveIndex()));
                      Class<?> bridge = Class.forName(INTEGRATION + "RenciaLoginBridge");
                      Method m = bridge.getMethod("switchToList", int.class, Runnable.class, Runnable.class);
                      m.invoke(null, target, new Runnable() {
                          @Override public void run() { openMain(); }
                      }, new Runnable() {
                          @Override public void run() { reloading = false; toast("Lista indisponível"); }
                      });
                  } catch (Throwable t) {
                      reloading = false;
                  }
              }

              private static void openMain() {
                  try {
                      Class<?> main = Class.forName("com.iptv.cliente.MainActivity");
                      Activity a = top.get();
                      Context ctx = a != null ? a : app;
                      Intent intent = new Intent(ctx, main);
                      intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TASK | Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(intent);
                  } catch (Throwable ignored) {
                  } finally {
                      playerActive = false;
                      MAIN.postDelayed(new Runnable() {
                          @Override public void run() { reloading = false; }
                      }, 5000L);
                  }
              }

              // ------------------------------------------------------------------ tela

              /** Mostra um aviso na tela. Devolve false se não há tela aberta agora (tenta de novo no próximo ciclo). */
              private static boolean showDialog(final String title, final String message) {
                  final Activity a = top.get();
                  if (a == null || a.isFinishing()) return false;
                  if (message == null || message.trim().isEmpty()) return true;
                  MAIN.post(new Runnable() {
                      @Override public void run() {
                          try {
                              if (a.isFinishing()) return;
                              AlertDialog.Builder b = new AlertDialog.Builder(a);
                              b.setTitle(title == null || title.isEmpty() ? "Aviso" : title);
                              b.setMessage(message);
                              b.setCancelable(true);
                              b.setPositiveButton("OK", new DialogInterface.OnClickListener() {
                                  @Override public void onClick(DialogInterface d, int w) { d.dismiss(); }
                              });
                              b.show();
                          } catch (Throwable ignored) {
                          }
                      }
                  });
                  return true;
              }

              private static void toast(final String text) {
                  MAIN.post(new Runnable() {
                      @Override public void run() {
                          try {
                              Context c = top.get() != null ? top.get() : app;
                              if (c != null) Toast.makeText(c, text, Toast.LENGTH_LONG).show();
                          } catch (Throwable ignored) {
                          }
                      }
                  });
              }

              // ------------------------------------------------------------------ dados do app (reflexão)

              private static String currentMac() {
                  try {
                      Class<?> cache = Class.forName(INTEGRATION + "RenciaCredentialCache");
                      Object v = cache.getMethod("mac").invoke(null);
                      return v instanceof String ? ((String) v).trim() : "";
                  } catch (Throwable t) {
                      return "";
                  }
              }

              private static int cacheActiveIndex() {
                  try {
                      Class<?> cache = Class.forName(INTEGRATION + "RenciaCredentialCache");
                      return (Integer) cache.getMethod("activeIndex").invoke(null);
                  } catch (Throwable t) {
                      return 0;
                  }
              }

              private static int cacheCount() {
                  try {
                      Class<?> cache = Class.forName(INTEGRATION + "RenciaCredentialCache");
                      return (Integer) cache.getMethod("count").invoke(null);
                  } catch (Throwable t) {
                      return 0;
                  }
              }

              private static boolean cacheHasList(int idx) {
                  return idx >= 0 && idx < cacheCount();
              }

              private static SharedPreferences prefs() {
                  try {
                      return app.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  } catch (Throwable t) {
                      return null;
                  }
              }

              // ------------------------------------------------------------------ HTTP (Railway primeiro, Manus de reserva)

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              /** GET com app_id; se o painel disser que o MAC não é desse app, repete sem app_id. */
              private static JSONObject getWithAppId(String path) {
                  if (sendAppId) {
                      JSONObject r = get(path + "&app_id=" + APP_ID);
                      if (r != null && !r.optBoolean("success", true) && r.optString("message", "").contains("vinculado")) {
                          sendAppId = false;
                      } else {
                          return r;
                      }
                  }
                  return get(path);
              }

              private static JSONObject get(String path) {
                  return request("GET", path, null);
              }

              private static JSONObject post(String path, JSONObject body) {
                  return request("POST", path, body);
              }

              private static JSONObject request(String method, String path, JSONObject body) {
                  for (int i = 0; i < BASES.length; i++) {
                      HttpURLConnection c = null;
                      try {
                          c = (HttpURLConnection) new URL(BASES[i] + path).openConnection();
                          c.setRequestMethod(method);
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(12000);
                          c.setUseCaches(false);
                          c.setRequestProperty("Accept", "application/json");
                          if (body != null) {
                              c.setDoOutput(true);
                              c.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                              OutputStream os = c.getOutputStream();
                              os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                              os.close();
                          }
                          int code = c.getResponseCode();
                          InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                          String text = in == null ? "" : read(in).trim();
                          if (code >= 500) continue;               // erro do servidor: tenta o reserva
                          if (!text.startsWith("{")) continue;     // HTML/lixo: tenta o reserva
                          return new JSONObject(text);             // 2xx e 4xx são respostas de verdade
                      } catch (Throwable ignored) {
                      } finally {
                          if (c != null) c.disconnect();
                      }
                  }
                  return null;
              }

              private static String read(InputStream in) throws Exception {
                  BufferedReader r = new BufferedReader(new InputStreamReader(in, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) sb.append(line);
                  r.close();
                  return sb.toString();
              }
          }
          JEOF

          # 1) smali: só os dex que têm algo a corrigir
          : > work/applied.txt
          CHANGED=""
          for F in work/dex/classes*.dex; do
            NAME=$(basename "$F")
            if grep -aq -e "renciaapp.manus.space" -e "UpdateBannerKt" -e "PlatformBranding" -e "ui/components/SideNavKt" -e "PlaybackContext" -e "MainActivityKt" "$F"; then
              echo "== $NAME"
              baksmali d "$F" -o "work/smali_$NAME"
              python3 patch_all.py "work/smali_$NAME" work/applied.txt
              # mantém a mesma versão de dex do original (035/037/038/039), para não mudar a compatibilidade
              VER=$(head -c 7 "$F" | tail -c 3)
              case "$VER" in 037) API=24 ;; 038) API=26 ;; 039) API=28 ;; *) API=15 ;; esac
              echo "dex $NAME versão $VER -> smali --api $API"
              smali a --api "$API" "work/smali_$NAME" -o "work/new/$NAME"
              CHANGED="$CHANGED $NAME"
            fi
          done
          test -n "$CHANGED" || { echo "Nenhum dex para corrigir"; exit 1; }
          sort -u work/applied.txt > work/applied_u.txt
          echo "Patches aplicados:"; cat work/applied_u.txt
          for P in painel heartbeat atualizacao fechar fechar_titulo fechar_texto fechar_config logo hook_app hook_pending hook_active hook_error; do
            grep -qx "$P" work/applied_u.txt || { echo "ERRO: patch '$P' não foi aplicado"; exit 1; }
          done

          # 2) código novo do painel (Assistindo, avisos, comandos, troca de lista): compila e vira um dex à parte
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          ANDROID_JAR=$(ls "$ANDROID_SDK_ROOT"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "build-tools: $BT | android.jar: $ANDROID_JAR"
          javac -nowarn -Xlint:-options --release 8 -cp "$ANDROID_JAR" -d work/jc src/com/optimus/panel/OptimusPanel.java
          "$BT/d8" --release --min-api 21 --lib "$ANDROID_JAR" --output work/d8 $(find work/jc -name '*.class')
          NDEX=$(ls work/dex/classes*.dex | wc -l)
          NEWDEX="classes$((NDEX + 1)).dex"
          cp work/d8/classes.dex "work/new/$NEWDEX"
          CHANGED="$CHANGED $NEWDEX"
          echo "Dex novo do painel: $NEWDEX"

          # 3) imagens: ícones, banner, splash, logo da ativação e logo interna
          python3 make_assets.py "$APK" optimus_logo.png work/res

          # 4) monta o APK
          cp "$APK" work/unsigned.apk
          zip -q -d work/unsigned.apk 'META-INF/*' || true
          (cd work/new && zip -q ../unsigned.apk $CHANGED)
          (cd work/res && zip -q -r -D ../unsigned.apk res assets)

          "$BT/zipalign" -p -f 4 work/unsigned.apk work/aligned.apk
          OUT="Optimus-ajustado.apk"
          "$BT/apksigner" sign --ks optimus.keystore --ks-key-alias optimus \
            --ks-pass pass:optimus-test-key --key-pass pass:optimus-test-key \
            --out "$OUT" work/aligned.apk
          "$BT/apksigner" verify --verbose "$OUT"

          # conferência final dentro do APK pronto
          python3 - <<'PYEOF'
          import zipfile
          z = zipfile.ZipFile("Optimus-ajustado.apk")
          names = z.namelist()
          dexnames = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
          dex = b"".join(z.read(n) for n in dexnames)
          assert b"renciaapp-production.up.railway.app" in dex, "Railway não encontrado no APK final"
          # o Manus só pode aparecer como reserva dentro do código novo do painel (OptimusPanel); no resto do app não
          for n in dexnames:
              raw = z.read(n)
              if b"renciaapp.manus.space" in raw:
                  assert b"Lcom/optimus/panel/OptimusPanel;" in raw, "Manus ainda presente em " + n
          assert b"__idle__" in dex, "Sentinela __idle__ ausente no APK final"
          assert b"file:///android_asset/optimus_logo.png" in dex, "Logo interna não ligada"
          assert b"Lcom/optimus/panel/OptimusPanel;" in dex, "Código do painel ausente no APK final"
          holders = [n for n in dexnames if b"Lcom/optimus/panel/OptimusPanel;" in z.read(n) and b"onPlayerActive" in z.read(n)]
          assert holders, "Classe OptimusPanel não está em nenhum dex"
          assert "assets/optimus_logo.png" in names, "assets/optimus_logo.png ausente"
          for n in ("res/drawable/ic_launcher.webp", "res/drawable-xxxhdpi/ic_launcher.webp", "res/drawable/banner.webp"):
              assert n in names, n + " ausente"
          print("OK: painel, Assistindo, logo, ícones e ajustes presentes no APK final (dex do painel:", holders, ")")
          PYEOF
          sha256sum "$OUT"

      - name: Guardar o APK ajustado
        uses: actions/upload-artifact@v4
        with:
          name: Optimus-ajustado
          path: Optimus-ajustado.apk
